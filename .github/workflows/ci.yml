name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test and package
        run: |
          pnpm test
          pnpm package
      - uses: actions/upload-artifact@v4
        with:
          name: split-view-${{ github.sha }}
          path: split-view.zip
          if-no-files-found: error
