name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Verify tag and manifest versions
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          manifest_version="$(node -p "require('./public/manifest.json').version")"
          test "v${package_version}" = "${GITHUB_REF_NAME}"
          test "${manifest_version}" = "${package_version}"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test and package
        run: |
          pnpm test
          pnpm package
          sha256sum split-view.zip > split-view.zip.sha256
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" split-view.zip split-view.zip.sha256 --clobber
          else
            gh release create "${GITHUB_REF_NAME}" split-view.zip split-view.zip.sha256 --verify-tag --generate-notes
          fi
